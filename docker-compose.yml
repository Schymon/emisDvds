services:
  emis-dvds:
    image: 'schymon/emisdvds:latest'
    container_name: emis-dvds
    ports:
      - '3020:3004'
    volumes:
      - '/opt/emisDvds:/app/src/data'
    restart: unless-stopped
    environment:
      - 'TMDB_API_KEY=${TMDB_API_KEY}'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
